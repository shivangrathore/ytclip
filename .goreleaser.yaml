version: 2

project_name: ytclip

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - env:
      # No cgo anywhere in the tree, so every target cross-compiles
      # from one machine. This is the whole reason the tool is in Go.
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}
    flags:
      - -trimpath

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

