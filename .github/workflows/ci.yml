name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # gofmt + go vet + go test, the same target used locally.
      - run: make check

  # The whole point of the Go rewrite is that one host builds every
  # target, so prove that on every push rather than discovering it at
  # release time.
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - run: make -j binaries
